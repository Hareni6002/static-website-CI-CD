<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Static Website Hosting with CI/CD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 50px;
            max-width: 700px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 2.2em;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #764ba2;
            font-weight: 600;
            margin-bottom: 30px;
        }
        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #764ba2;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
            border-radius: 8px;
        }
        .info-box p { margin: 8px 0; color: #555; }
        .badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 20px;
        }
        .tech-stack {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .tech {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Static Website Hosting with CI/CD</h1>
        <p class="subtitle">A DevOps Mini Project</p>

        <div class="info-box">
            <p><strong>Hosting:</strong> Nginx on Ubuntu VM (VirtualBox)</p>
            <p><strong>Version Control:</strong> Git + GitHub</p>
            <p><strong>CI/CD:</strong> GitHub Actions with Self-Hosted Runner</p>
            <p><strong>Deployment:</strong> Fully Automated</p>
        </div>

        <div class="tech-stack">
            <span class="tech">Ubuntu</span>
            <span class="tech">Nginx</span>
            <span class="tech">Git</span>
            <span class="tech">GitHub Actions</span>
        </div>

        <p class="badge">✅ Deployed Automatically via CI/CD Pipeline</p>
    </div>
</body>
</html>
